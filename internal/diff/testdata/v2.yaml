openapi: 3.0.0
info: {title: Shop, version: 2.0.0}
paths:
  /items:
    get:
      operationId: listItems
      parameters:
        - name: filter
          in: query
          required: true
          schema: {type: string}
        - name: limit
          in: query
          required: true
          schema: {type: integer, format: int64}
        - name: sort
          in: query
          schema: {type: string}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
    post:
      operationId: createItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Item'
      responses:
        '201':
          description: created
  /orders:
    get:
      operationId: listOrders
      responses:
        '200':
          description: ok
components:
  schemas:
    Item:
      type: object
      required: [id, name, sku]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        status: {type: string, enum: [active]}
        count: {type: number}
        note: {type: string}
        sku: {type: string}
        shape:
          oneOf:
            - type: string
            - type: boolean
