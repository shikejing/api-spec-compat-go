openapi: 3.0.0
info: {title: Violations, version: 1.0.0}
paths:
  /things/:
    get:
      operationId: listThings
      responses:
        '200':
          description: ''
    post:
      operationId: listThings
      responses:
        '204':
          description: no content
  /things/{thingId}:
    get:
      operationId: getThing
      parameters:
        - name: thing_id
          in: path
          required: true
          schema: {type: string}
        - name: Other
          in: query
          schema: {type: string}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thing'
components:
  schemas:
    Thing:
      properties:
        id: {type: string}
    Status:
      type: string
      enum: []
