openapi: 3.0.3
info:
  title: Pet Store
  version: "2.0.0"
paths:
  /pets:
    get:
      operationId: listPets
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: a list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "../common-types.yaml#/components/schemas/PetStatus"
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, tag]
              properties:
                name: {type: string}
                tag: {type: string}
                status:
                  type: string
                  enum: [available, sold]
      responses:
        '201':
          description: created
  /pets/{petId}:
    get:
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: a pet
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: {type: string}
